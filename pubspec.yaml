name: ironlog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  vibration: ^3.1.3
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  before_after: ^3.1.0
  speech_to_text: ^7.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/foods.json
    - assets/data/indian_recipes.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ironlog_icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/ironlog_icon.png"
  min_sdk_android: 21